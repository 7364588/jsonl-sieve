[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-sieve"
version = "0.1.0"
description = "A bounded, streaming JSON Lines validator and shape profiler"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Development Status :: 3 - Alpha",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
jsonl-sieve = "jsonl_sieve.cli:main"

[project.urls]
Repository = "https://github.com/7364588/jsonl-sieve"
Issues = "https://github.com/7364588/jsonl-sieve/issues"

[tool.setuptools.packages.find]
where = ["src"]
